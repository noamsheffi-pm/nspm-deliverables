<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NSPM Deliverables</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0c0c0f; --surface: #14141a; --surface2: #1c1c25; --border: #2a2a35;
      --accent: #ff5c2b; --accent2: #ffb547; --text: #e8e6e0; --muted: #8a8796;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; overflow-x: hidden; }
    header { padding: 2.5rem 2rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -0.03em; line-height: 1; }
    .logo span { color: var(--accent); }
    .tagline { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 1rem 0; display: flex; flex-direction: column; gap: 0.8rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    input[type=search] { flex: 1; min-width: 200px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font: inherit; font-size: 0.9rem; padding: 0.7rem 0.9rem; border-radius: 3px; outline: none; }
    input[type=search]:focus { border-color: var(--accent); }
    select { background: var(--surface); border: 1px solid var(--border); color: var(--text); font: inherit; font-size: 0.75rem; padding: 0.65rem 0.6rem; border-radius: 3px; }
    .chip { font: inherit; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 0.35rem 0.7rem; border-radius: 2px; cursor: pointer; }
    .chip:hover { color: var(--text); }
    .chip.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
    .chip .n { opacity: 0.7; margin-left: 0.3rem; }
    .count { font-size: 0.7rem; color: var(--muted); margin-left: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 3rem; }
    .card { background: var(--surface); padding: 1.3rem 1.4rem; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 0.6rem; transition: background 0.15s; min-width: 0; }
    .card:hover { background: var(--surface2); }
    .card:hover .card-arrow { transform: translate(3px, -3px); color: var(--accent); }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .card-tag { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); background: rgba(255,92,43,0.08); padding: 0.25rem 0.6rem; border-radius: 2px; }
    .card-tag.design { color: var(--accent2); background: rgba(255,181,71,0.08); }
    .card-tag.prd { color: #7dd3fc; background: rgba(125,211,252,0.08); }
    .card-tag.flow { color: #a78bfa; background: rgba(167,139,250,0.08); }
    .card-tag.pitch { color: #4ade80; background: rgba(74,222,128,0.08); }
    .card-tag.demo { color: #f472b6; background: rgba(244,114,182,0.08); }
    .card-tag.eng, .card-tag.other { color: var(--muted); background: rgba(138,135,150,0.1); }
    .card-arrow { font-size: 1rem; color: var(--muted); transition: transform 0.2s, color 0.2s; }
    .card-title { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 1rem; line-height: 1.3; overflow-wrap: anywhere; }
    .card-meta { font-size: 0.68rem; color: var(--muted); }
    .card-foot { margin-top: auto; display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.62rem; color: var(--muted); }
    .card-file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .copy { font: inherit; font-size: 0.6rem; background: none; border: 1px solid var(--border); color: var(--muted); padding: 0.15rem 0.45rem; border-radius: 2px; cursor: pointer; flex-shrink: 0; }
    .copy:hover { color: var(--accent); border-color: var(--accent); }
    mark { background: rgba(255,181,71,0.25); color: inherit; }
    .empty { padding: 3rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
    footer { border-top: 1px solid var(--border); padding: 1.5rem 2rem; font-size: 0.65rem; color: var(--muted); }
    @media (max-width: 600px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      header { flex-direction: column; align-items: flex-start; }
      .count { margin-left: 0; width: 100%; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header>
  <div class="logo">NS<span>PM</span><br>Deliverables</div>
  <div class="tagline">Press / to search</div>
</header>
<main>
  <div class="controls">
    <div class="row">
      <input type="search" id="q" placeholder="Search title, file, context..." autocomplete="off" autofocus>
      <select id="sort" aria-label="Sort">
        <option value="new">Newest first</option>
        <option value="upd">Recently updated</option>
        <option value="old">Oldest first</option>
        <option value="az">A to Z</option>
      </select>
      <select id="month" aria-label="Month"><option value="">All months</option></select>
    </div>
    <div class="row" id="tags"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer>Built from the repo by build-index.py. Every page is listed, no manual cards.</footer>
<script>
const DATA = /*__DATA__*/[];
const BASE = location.origin + '/';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const state = { q: '', tag: '', sort: 'new', month: '' };

// read state from URL hash so filtered views can be shared
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in state) state[k] = v; });

const tags = {};
DATA.forEach(d => tags[d.tag] = (tags[d.tag] || 0) + 1);
const months = [...new Set(DATA.map(d => d.published.slice(0, 7)).filter(Boolean))].sort().reverse();
months.forEach(m => $('month').insertAdjacentHTML('beforeend',
  `<option value="${m}">${new Date(m + '-01T00:00:00').toLocaleDateString('en-GB', {month:'short', year:'numeric'})}</option>`));

function renderTags() {
  const all = [['', DATA.length], ...Object.entries(tags).sort((a, b) => b[1] - a[1])];
  $('tags').innerHTML = all.map(([t, n]) =>
    `<button class="chip ${state.tag === t ? 'on' : ''}" data-tag="${t}">${t || 'all'}<span class="n">${n}</span></button>`
  ).join('') + '<span class="count" id="count"></span>';
}

function hl(text, terms) {
  let s = esc(text);
  terms.forEach(t => { if (t) s = s.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });
  return s;
}

function render() {
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  let rows = DATA.filter(d => {
    if (state.tag && d.tag !== state.tag) return false;
    if (state.month && !d.published.startsWith(state.month)) return false;
    const hay = (d.title + ' ' + d.meta + ' ' + d.file + ' ' + d.tag).toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  const by = {
    new: (a, b) => b.published.localeCompare(a.published),
    upd: (a, b) => b.updated.localeCompare(a.updated),
    old: (a, b) => a.published.localeCompare(b.published),
    az:  (a, b) => a.title.localeCompare(b.title),
  }[state.sort];
  rows.sort(by);
  $('grid').innerHTML = rows.length ? rows.map(d => `
    <a class="card" href="${d.href}" target="_blank" rel="noopener">
      <div class="card-top">
        <span class="card-tag ${esc(d.tag)}">${esc(d.tag)}</span>
        <span class="card-arrow">&#x2197;</span>
      </div>
      <div class="card-title">${hl(d.title, terms)}</div>
      ${d.meta ? `<div class="card-meta">${hl(d.meta, terms)}</div>` : ''}
      <div class="card-foot">
        <span class="card-file" title="${esc(d.file)}">${fmt(d.published)}${d.updated && d.updated !== d.published ? ' · upd ' + fmt(d.updated) : ''}</span>
        <button class="copy" data-href="${d.href}" title="Copy link">copy link</button>
      </div>
    </a>`).join('') : '<div class="empty">No match. Try fewer words.</div>';
  $('count').textContent = `${rows.length} of ${DATA.length}`;
  const h = new URLSearchParams(Object.entries(state).filter(([k, v]) => v && !(k === 'sort' && v === 'new')));
  history.replaceState(null, '', h.toString() ? '#' + h : location.pathname);
}

$('q').value = state.q; $('sort').value = state.sort; $('month').value = state.month;
renderTags(); render();

$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('month').addEventListener('change', e => { state.month = e.target.value; render(); });
$('tags').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.tag = b.dataset.tag; renderTags(); render();
});
$('grid').addEventListener('click', e => {
  const b = e.target.closest('.copy'); if (!b) return;
  e.preventDefault();
  navigator.clipboard.writeText(BASE + b.dataset.href).then(() => { b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy link', 1200); });
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape') { $('q').value = ''; state.q = ''; render(); }
});
</script>
</body>
</html>
